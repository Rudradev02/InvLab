name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: invlab_test
          POSTGRES_USER: invlab
          POSTGRES_PASSWORD: invlab_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Django System Check
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-placeholder
          DJANGO_DEBUG: "0"
          DATABASE_URL: postgresql://invlab:invlab_password@localhost:5432/invlab_test
        run: |
          python manage.py check

      - name: Check for Unapplied Migrations
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-placeholder
          DJANGO_DEBUG: "0"
          DATABASE_URL: postgresql://invlab:invlab_password@localhost:5432/invlab_test
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Migrations
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-placeholder
          DJANGO_DEBUG: "0"
          DATABASE_URL: postgresql://invlab:invlab_password@localhost:5432/invlab_test
        run: |
          python manage.py migrate

      - name: Run Backend Tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-placeholder
          DJANGO_DEBUG: "0"
          DATABASE_URL: postgresql://invlab:invlab_password@localhost:5432/invlab_test
        run: |
          python manage.py test

  frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit Tests
        run: npm test --if-present

      - name: Production Build
        run: npm run build
